[project]
name = "groundloop-controlfirst"
version = "0.1.0"
description = "Evidence-first research workflow for ControlFirst decisions"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "mcp>=1.2,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
groundloop-api = "services.local_api.main:run"
groundloop-mcp = "services.mcp_server.main:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

